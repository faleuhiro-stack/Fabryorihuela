<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media | Fabry Orihuela</title>
  <link rel="stylesheet" href="styles.css?v=92002">
</head>

<body>
  <div class="container">
    <div class="card">

      <img src="img/logo.png" alt="Fabry Orihuela" class="logo">

      <h1 id="title">📱 Social Media</h1>
      <p class="tagline" id="tagline">Connect with me and support my music</p>

      <!-- GRID 2 COLUMNAS -->
      <div class="social-grid">
        <a class="button" href="https://www.youtube.com/@Fabricioorihuela" target="_blank" rel="noopener">▶️ YouTube</a>
        <a class="button" href="https://www.instagram.com/fabryorihuelaoficial" target="_blank" rel="noopener">📸 Instagram</a>

        <a class="button" href="https://www.tiktok.com/@fabry.orihuela" target="_blank" rel="noopener">🎵 TikTok</a>
        <a class="button" href="https://www.facebook.com/fabryorihuelaoficial/" target="_blank" rel="noopener">👍 Facebook</a>

        <a class="button" href="https://open.spotify.com/artist/3gwUw97MMCSVKbFocMIz0a" target="_blank" rel="noopener">🟢 Spotify</a>
        <a class="button" href="https://music.apple.com/us/artist/fabricio-orihuela/1015171212" target="_blank" rel="noopener">🍎 Apple Music</a>

        <a class="button" href="https://wa.me/14845442917" target="_blank" rel="noopener">💬 WhatsApp</a>
        <a class="button" href="index.html" id="backBtn">⬅️ Back</a>
      </div>

      <!-- IDIOMA -->
      <div class="lang-row">
        <button class="button ghost" id="btnEN" type="button">🇺🇸 English</button>
        <button class="button ghost" id="btnES" type="button">🇪🇸 Español</button>
      </div>

      <p class="footer-note" id="footer">
        Thanks for following and supporting independent music 🤘
      </p>

    </div>
  </div>

  <script>
    const t = {
      en: {
        pageTitle: "Social Media | Fabry Orihuela",
        title: "📱 Social Media",
        tagline: "Connect with me and support my music",
        back: "⬅️ Back",
        footer: 
      },
      es: {
        pageTitle: "Sígueme en mis redes | Fabry Orihuela",
        title: "📱 Sígueme en mis redes",
        tagline: "Conecta conmigo y apoya mi música",
        back: "⬅️ Volver",
        footer:
      }
    };

    function setLang(lang){
      document.title = t[lang].pageTitle;
      document.documentElement.lang = (lang === "es") ? "es" : "en";
      document.getElementById("title").textContent = t[lang].title;
      document.getElementById("tagline").textContent = t[lang].tagline;
      document.getElementById("backBtn").textContent = t[lang].back;
      document.getElementById("footer").textContent = t[lang].footer;

      // estado visual
      document.getElementById("btnEN").classList.toggle("activeLang", lang === "en");
      document.getElementById("btnES").classList.toggle("activeLang", lang === "es");
    }

    document.getElementById("btnEN").addEventListener("click", () => setLang("en"));
    document.getElementById("btnES").addEventListener("click", () => setLang("es"));
    setLang("en");
  </script>

  <style>
    /* ===== SOLO REDES: 2 COLUMNAS PRO ===== */
    .social-grid{
      display:grid;
      gap: 12px;
      margin-top: 10px;
    }

    /* desktop: 2 columnas */
    @media (min-width: 760px){
      .social-grid{
        grid-template-columns: 1fr 1fr;
      }
      .social-grid .button{
        max-width: none;  /* deja que ocupe la celda */
        margin: 0;        /* el grid controla el espacio */
      }
    }

    /* móvil: 1 columna */
    @media (max-width: 759px){
      .social-grid{
        grid-template-columns: 1fr;
      }
    }

    /* fila de idioma */
    .lang-row{
      display:flex;
      gap: 10px;
      justify-content:center;
      margin-top: 14px;
      flex-wrap:wrap;
    }
    .lang-row .button{
      max-width: 220px;
      margin: 0;
    }

    /* estilo "ghost" para idioma (más pro) */
    .button.ghost{
      background: rgba(10,10,14,.45) !important;
      border: 1px solid rgba(255,255,255,.18) !important;
      box-shadow: 0 10px 22px rgba(0,0,0,.35) !important;
    }
    .activeLang{
      outline: 2px solid rgba(255,255,255,.45);
      filter: brightness(1.05);
    }
    /* =========================================
   REDES — BOTONES DORADOS ESTILO HOME
   ========================================= */

.social-grid{
  width: 100%;
  max-width: 680px;
  margin: 20px auto 0;
}

/* Todos los botones de redes */
.social-grid .button{
  width: 85% !important;
  max-width: 580px !important;
  margin: 0 auto !important;

  background: linear-gradient(
    180deg,
    #f1d276 0%,
    #d8b44d 50%,
    #bd922d 100%
  ) !important;

  color: #0a0a0a !important;
  border: 1px solid #f3d982 !important;
  border-radius: 28px !important;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    0 8px 20px rgba(190,145,35,.15) !important;

  font-weight: 700 !important;
  text-align: center !important;
}

/* Efecto al tocar */
.social-grid .button:active{
  transform: scale(.98);
}

/* =========================================
   LOGO CENTRADO
   ========================================= */

.card .logo{
  display: block !important;
  margin-left: auto !important;
  margin-right: auto !important;
  object-fit: contain;
}

/* =========================================
   TELÉFONO
   ========================================= */

@media (max-width: 759px){

  .social-grid{
    width: 100%;
    max-width: 100%;
    gap: 14px;
  }

  .social-grid .button{
    width: 84% !important;
    max-width: 520px !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }

  .card .logo{
    margin-left: auto !important;
    margin-right: auto !important;
  }
}
  </style>
</body>
</html>
