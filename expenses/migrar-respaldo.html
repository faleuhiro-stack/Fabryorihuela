
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabry Expenses - Migración</title>

<style>
*{box-sizing:border-box}
body{
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  max-width:650px;
  margin:30px auto;
  padding:20px;
}
h2{color:#d4af37}
.card{
  background:#222;
  padding:20px;
  border-radius:12px;
  margin:15px 0;
}
label{display:block;margin-top:15px}
input,button{
  width:100%;
  padding:14px;
  margin-top:9px;
  border:0;
  border-radius:8px;
  font-size:15px;
}
input{background:#eee;color:#111}
button{
  background:#a52828;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  opacity:.45;
  cursor:not-allowed;
}
#result{
  white-space:pre-wrap;
  line-height:1.6;
  overflow-wrap:anywhere;
}
.note{color:#bbb;font-size:13px}
</style>
</head>

<body>

<h2>Fabry Expenses</h2>
<h3>Migración segura del iPhone</h3>

<p>
Esta página permite importar tu respaldo a Supabase.
No modifica la aplicación principal.
</p>

<div class="card">

<label>Correo de Supabase</label>
<input id="email" type="email"
placeholder="Tu correo">

<label>Contraseña de Supabase</label>
<input id="password" type="password"
placeholder="Tu contraseña">

<label>Respaldo JSON del iPhone</label>
<input id="backup" type="file"
accept=".json,application/json">

<button type="button" id="preview">
VERIFICAR RESPALDO
</button>

</div>

<div class="card">
<div id="result">Página preparada. Seleccioná tu respaldo.</div>
</div>

<button type="button" id="migrate" disabled>
CONFIRMAR E IMPORTAR
</button>

<p class="note">
No cierres la página durante la importación.
Nunca compartas tu contraseña.
</p>

<script type="module">

const SUPABASE_URL =
"https://iaaxbmhkpczublsopskr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_j5lFAAO8QhY_S7UPBigGQg_KucoJ1Tb";

const $ = id => document.getElementById(id);

let db = null;
let backupData = null;
let verified = false;
let userId = null;

function show(message){
  $("result").textContent = message;
}

function total(items){
  return items.reduce(
    (sum,item)=>sum + Number(item.amount || 0),0
  );
}

async function getDatabase(){

  if(db) return db;

  show("Conectando con Supabase...");

  const module = await import(
    "https://esm.sh/@supabase/supabase-js@2"
  );

  db = module.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  return db;
}

/* VERIFICAR RESPALDO */

$("preview").addEventListener("click",async()=>{

  $("preview").disabled = true;
  $("migrate").disabled = true;

  verified = false;
  backupData = null;
  userId = null;

  try{

    const file = $("backup").files[0];

    if(!file){
      throw new Error("Seleccioná el archivo JSON.");
    }

    show("Leyendo respaldo...");

    const content = await file.text();
    const data = JSON.parse(content);

    const lists = [
      "expenses",
      "incomes",
      "bookings",
      "quotes",
      "invoices"
    ];

    for(const key of lists){
      if(!Array.isArray(data[key])){
        throw new Error(
          "Falta una lista válida: " + key
        );
      }
    }

    if(
      data.expenses.length !== 40 ||
      data.incomes.length !== 27
    ){
      throw new Error(
        "El respaldo no coincide con los 40 gastos y 27 ingresos esperados."
      );
    }

    for(const key of ["expenses","incomes"]){

      const ids = new Set();

      for(const item of data[key]){

        if(
          !item.id ||
          !item.date ||
          !Number.isFinite(Number(item.amount))
        ){
          throw new Error(
            "Hay un movimiento incompleto en " + key
          );
        }

        if(ids.has(item.id)){
          throw new Error(
            "Hay identificadores duplicados en " + key
          );
        }

        ids.add(item.id);
      }
    }

    show("Respaldo correcto. Verificando cuenta...");

    const email = $("email").value.trim();
    const password = $("password").value;

    if(!email || !password){
      throw new Error(
        "Ingresá tu correo y contraseña."
      );
    }

    const client = await getDatabase();

    const {data:auth,error:authError} =
      await client.auth.signInWithPassword({
        email,
        password
      });

    if(authError) throw authError;

    if(!auth.user){
      throw new Error("No se pudo verificar la cuenta.");
    }

    userId = auth.user.id;

    const {data:rows,error:readError} =
      await client
      .from("fabry_expenses_data")
      .select("user_id,data")
      .eq("user_id",userId);

    if(readError) throw readError;

    if(!rows || rows.length !== 1){
      throw new Error(
        "No encontramos exactamente un registro de tu cuenta."
      );
    }

    const current = rows[0].data || {};

    for(const key of lists){

      if(
        Array.isArray(current[key]) &&
        current[key].length > 0
      ){
        throw new Error(
          "La lista " + key +
          " ya contiene datos. Se cancela para protegerlos."
        );
      }
    }

    backupData = data;
    verified = true;

    show(
      "RESPALDO VERIFICADO CORRECTAMENTE\n\n" +
      "Cuenta: " + auth.user.email + "\n\n" +
      "Gastos: " + data.expenses.length +
      " — $" + total(data.expenses).toFixed(2) + "\n" +
      "Ingresos: " + data.incomes.length +
      " — $" + total(data.incomes).toFixed(2) + "\n" +
      "Reservas: " + data.bookings.length + "\n" +
      "Presupuestos: " + data.quotes.length + "\n" +
      "Facturas: " + data.invoices.length + "\n\n" +
      "Total de movimientos: 67\n\n" +
      "Supabase está listo.\n" +
      "Todavía no se importó nada."
    );

    $("migrate").disabled = false;

  }catch(error){

    show(
      "ERROR DE VERIFICACIÓN\n\n" +
      (error.message || String(error))
    );

  }finally{

    $("preview").disabled = false;

  }

});

/* IMPORTAR */

$("migrate").addEventListener("click",async()=>{

  if(!verified || !backupData || !userId){
    show("Primero verificá el respaldo.");
    return;
  }

  const accepted = confirm(
    "¿Confirmás importar los 40 gastos y 27 ingresos del iPhone a Supabase?"
  );

  if(!accepted) return;

  $("migrate").disabled = true;

  try{

    show("Importando movimientos. Esperá...");

    const client = await getDatabase();

    const {data:sessionData,error:sessionError} =
      await client.auth.getSession();

    if(sessionError) throw sessionError;

    if(
      !sessionData.session ||
      sessionData.session.user.id !== userId
    ){
      throw new Error(
        "La sesión cambió. Volvé a verificar el respaldo."
      );
    }

    const {data:rows,error:readError} =
      await client
      .from("fabry_expenses_data")
      .select("user_id,data")
      .eq("user_id",userId);

    if(readError) throw readError;

    if(!rows || rows.length !== 1){
      throw new Error(
        "No se encontró el registro original."
      );
    }

    const current = rows[0].data || {};

    const lists = [
      "expenses",
      "incomes",
      "bookings",
      "quotes",
      "invoices"
    ];

    for(const key of lists){

      if(
        Array.isArray(current[key]) &&
        current[key].length > 0
      ){
        throw new Error(
          "La lista " + key +
          " ya contiene información. Se canceló la importación."
        );
      }
    }

    const finalData = {
      ...current,
      expenses:backupData.expenses,
      incomes:backupData.incomes,
      bookings:backupData.bookings,
      quotes:backupData.quotes,
      invoices:backupData.invoices
    };

    const {error:updateError} =
      await client
      .from("fabry_expenses_data")
      .update({
        data:finalData,
        updated_at:new Date().toISOString()
      })
      .eq("user_id",userId);

    if(updateError) throw updateError;

    const {data:check,error:checkError} =
      await client
      .from("fabry_expenses_data")
      .select("data")
      .eq("user_id",userId)
      .single();

    if(checkError) throw checkError;

    if(
      check.data.expenses.length !== 40 ||
      check.data.incomes.length !== 27
    ){
      throw new Error(
        "No pudimos confirmar todos los movimientos. Revisá Supabase antes de repetir."
      );
    }

    verified = false;

    show(
      "¡IMPORTACIÓN COMPLETADA!\n\n" +
      "Gastos: " + check.data.expenses.length + "\n" +
      "Ingresos: " + check.data.incomes.length + "\n" +
      "Total: 67 movimientos\n\n" +
      "Gastos: $" + total(check.data.expenses).toFixed(2) + "\n" +
      "Ingresos: $" + total(check.data.incomes).toFixed(2) + "\n\n" +
      "Los datos ya están guardados en Supabase.\n" +
      "La aplicación principal todavía no fue modificada."
    );

  }catch(error){

    show(
      "ERROR DURANTE LA IMPORTACIÓN\n\n" +
      (error.message || String(error)) +
      "\n\nNo repitas la operación sin revisar primero la tabla."
    );

    $("migrate").disabled = false;

  }

});

</script>

</body>
</html>
