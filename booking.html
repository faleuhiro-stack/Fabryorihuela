<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking | Fabry Orihuela</title>
  <link rel="stylesheet" href="styles.css?v=12001">
</head>

<body>
  <div class="container">
    <div class="card">

      <img src="img/logo.png" alt="Fabry Orihuela" class="logo">

      <h1>📅 Booking</h1>
      <p class="tagline">Completa el formulario y te respondo por WhatsApp</p>

      <form id="bookingForm" class="booking-form" autocomplete="on">
        <label class="field">
          <span>Nombre / Empresa</span>
          <input type="text" id="nombre" placeholder="Ej: Juan Pérez / Bar XYZ" required>
        </label>

        <label class="field">
          <span>Teléfono (opcional)</span>
          <input type="tel" id="telefono" placeholder="Ej: +1 555 123 4567" inputmode="tel">
        </label>

        <label class="field">
          <span>Fecha del evento</span>
          <input type="date" id="fecha" required>
        </label>

        <label class="field">
          <span>Lugar / Ciudad</span>
          <input type="text" id="lugar" placeholder="Ej: Philadelphia, PA" required>
        </label>

        <label class="field">
          <span>Tipo de evento</span>
          <select id="tipo" required>
            <option value="" selected disabled>Selecciona…</option>
            <option>Bar / Restaurante</option>
            <option>Boda</option>
            <option>Evento privado</option>
            <option>Festival</option>
            <option>Corporativo</option>
            <option>Otro</option>
          </select>
        </label>

        <label class="field">
          <span>Horario (opcional)</span>
          <input type="text" id="horario" placeholder="Ej: 8pm - 11pm">
        </label>

        <label class="field">
          <span>Duración (opcional)</span>
          <input type="text" id="duracion" placeholder="Ej: 2 horas">
        </label>

        <label class="field">
          <span>Presupuesto (opcional)</span>
          <input type="text" id="presupuesto" placeholder="Ej: $500 - $800">
        </label>

       <label class="field">
  <span>Detalles adicionales</span>
  <textarea id="detalles" rows="4" placeholder="Ej: sonido disponible, número de personas, repertorio, etc."></textarea>
</label>

<div class="booking-actions">
  <button type="submit" class="btn-red btn-send">
    ✅ Enviar por WhatsApp
  </button>

  <a class="btn-red btn-back" href="index.html">
    ⬅️ Volver
  </a>
</div>
</form>

<p class="footer-note">
  Respondo lo antes posible. Gracias 🙌
</p>
  <style>
    /* SOLO para el booking: alinea perfecto en desktop y móvil sin afectar otras páginas */
    .booking-form{ text-align:left; margin-top: 8px; }
    .field{ display:grid; gap:8px; margin: 12px 0; }
    .field span{ font-size: 13px; opacity: .88; }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.28);
      color:#fff;
      outline:none;
    }

    .field input::placeholder,
    .field textarea::placeholder{ color: rgba(255,255,255,.55); }

    .field input:focus,
    .field select:focus,
    .field textarea:focus{ border-color: rgba(255,255,255,.30); }

    /* Mantiene el botón centrado dentro del form */
    .booking-form .button{
      max-width: 520px;
      margin: 14px auto 0;
      cursor:pointer;
      border: 0; /* evita estilos raros por browser */
    }
    /* =========================================
   BOOKING — ESTILO DORADO FABRY
   ========================================= */

/* LOGO CENTRADO */
.card .logo{
  display: block !important;
  margin-left: auto !important;
  margin-right: auto !important;
  object-fit: contain;
}

/* CONTENEDOR DE LOS BOTONES */
.booking-actions{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  margin-top: 22px;
}

/* BOTONES BOOKING DORADOS */
.booking-actions .btn-red{
  display: flex;
  align-items: center;
  justify-content: center;

  width: 84% !important;
  max-width: 520px !important;
  min-height: 58px;

  margin: 0 auto !important;
  padding: 14px 24px;

  background: linear-gradient(
    180deg,
    #f1d276 0%,
    #d8b44d 50%,
    #bd922d 100%
  ) !important;

  color: #0a0a0a !important;
  border: 1px solid #f3d982 !important;
  border-radius: 28px !important;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    0 8px 20px rgba(190,145,35,.15) !important;

  font-weight: 700 !important;
  text-align: center !important;
  text-decoration: none !important;
  cursor: pointer;
  box-sizing: border-box;
  font-family: inherit;
}

/* EFECTO AL TOCAR */
.booking-actions .btn-red:active{
  transform: scale(.98);
}

/* TELÉFONO */
@media (max-width: 759px){

  .booking-actions .btn-red{
    width: 84% !important;
    max-width: 520px !important;
  }

  .card .logo{
    display: block !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }
}
  </style>

  <script>
    (function(){
      const PHONE = "14845442917"; // WhatsApp de Fabry
      function enc(v){ return encodeURIComponent(v || ""); }

      document.getElementById("bookingForm").addEventListener("submit", function(e){
        e.preventDefault();

        const nombre = document.getElementById("nombre").value.trim();
        const telefono = document.getElementById("telefono").value.trim();
        const fecha = document.getElementById("fecha").value;
        const lugar = document.getElementById("lugar").value.trim();
        const tipo = document.getElementById("tipo").value;
        const horario = document.getElementById("horario").value.trim();
        const duracion = document.getElementById("duracion").value.trim();
        const presupuesto = document.getElementById("presupuesto").value.trim();
        const detalles = document.getElementById("detalles").value.trim();

        const msg =
`📅 *BOOKING - Fabry Orihuela*
👤 Nombre/Empresa: ${nombre}
📞 Teléfono: ${telefono || "No especificado"}
📆 Fecha: ${fecha}
📍 Lugar/Ciudad: ${lugar}
🎉 Tipo de evento: ${tipo}
⏰ Horario: ${horario || "No especificado"}
⏳ Duración: ${duracion || "No especificado"}
💵 Presupuesto: ${presupuesto || "No especificado"}
📝 Detalles: ${detalles || "No especificado"}

✅ Quiero cotizar / reservar.`;

        const url = `https://wa.me/${PHONE}?text=${enc(msg)}`;
        window.open(url, "_blank");
      });
    })();
  </script>

</body>
</html>
